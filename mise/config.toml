[tools]
  7zip = "latest"           # 7z
  atuin = "latest"
  bat = "latest"
  bottom = "latest"          # btm
  carapace = "latest"
  "aqua:YS-L/csvlens" = "latest"   # csvlens
  delta = "latest"
  dust = "latest"
  eza = "latest"
  fd = "latest"
  fzf = "latest"
  gh = "latest"
  glow = "latest"
  lazygit = "latest"
  mosh = "latest"            # mosh, mosh-server
  node = "latest"            # node, npm, npx
  # 최신 Node에는 corepack이 포함되지 않을 수 있음
  "npm:corepack" = "latest"
  neovim = "latest"          # nvim
  pandoc = "latest"
  resvg = "latest"
  ripgrep = "latest"         # rg
  starship = "latest"
  tealdeer = "latest"        # tldr
  tree-sitter = "latest"
  typst = "latest"
  viddy = "latest"
  yazi = "latest"            # yazi, ya
  zellij = "latest"
  zoxide = "latest"
  "aqua:dalance/procs" = "latest"
  "github:clangd/clangd" = "latest"
  "github:atanunq/viu" = "latest"
  bitwarden = "latest"       # bw
  chezmoi = "latest"
  codex = "latest"
  # opencode = "latest"
  "npm:@opencode/cli" = { version = "latest", allow_builds = ["@opencode/cli"] }
  # opencode-vim v2 (ocv)
  "npm:@leohenon/ocv" = "ocv-v2"

[settings.npm]
# aube 설치기가 이 패키지에서 실패해서 npm으로 고정
package_manager = "npm"

[[mgr.prepend_keymap]]
on   = "!"
for  = "unix"
run  = [ "copy path --hovered", "shell --block -- bash -c 'export YAZI_SUBSHELL=1; exec bash'" ]
desc = "Copy hovered path and open Bash"

[[input.prepend_keymap]]
on   = "<Esc>"
run  = "close"
desc = "Cancel input"

[[mgr.prepend_keymap]]
on   = "<Enter>"
run  = "plugin smart-enter"
desc = "Enter the child directory, or open the file"

[[mgr.prepend_keymap]]
on   = "z"
run  = "plugin zoxide"
desc = "Zoxide jump"

[[mgr.prepend_keymap]]
on   = "<C-t>"
run  = "plugin fzf"
desc = "FZF search"

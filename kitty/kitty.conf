# Font Configuration
font_family Jetendard
bold_font auto
italic_font auto
bold_italic_font auto
font_size 11.0

# Window Configuration
window_padding_width 12 12 0 12
background_opacity 1.0
background_blur 32
hide_window_decorations yes
confirm_os_window_close 0

# Cursor Configuration
cursor_shape beam
cursor_blink_interval 1

# Scrollback
scrollback_lines 3000

# Terminal features
copy_on_select yes
strip_trailing_spaces smart

# Key bindings for common actions
map ctrl+v paste_from_clipboard
map ctrl+shift+space kitten kitty_grab/grab.py
map ctrl+shift+n new_window
map ctrl+shift+t new_tab
map ctrl+plus change_font_size all +1.0
map ctrl+minus change_font_size all -1.0
map ctrl+0 change_font_size all 0

# Tab configuration
tab_bar_style powerline
tab_bar_align left

# Shell integration
shell_integration enabled

# Dank color generation
include dank-tabs.conf
include dank-theme.conf

# Personal background override; keep after DMS-generated colors.
# background #202020
# tab_bar_background #202020
# tab_bar_margin_color #202020
# inactive_tab_background #202020

# Text greys. pixel.nvim draws comments and secondary UI text with ANSI 8, but
# DMS uses ANSI 8 as a dark surface (#434149) for the statusline, popups and
# highlights, so it stays dark. Two dedicated slots instead:
#   color245 #938f99  Material 3 "outline", ~5.9:1 - comments, readable labels
#   color242 #74707e  mid grey, ~3.9:1 - line numbers, delimiters, hints
color242 #74707e
color245 #938f99

# ANSI 5 (magenta/purple) override.
# DMS generates #4F378B (~1.99:1), far too dark for code text.
# #ea86ff is the theme primary #D0BCFF rotated toward magenta, same pastel-high-chroma
# feel, but 30deg of hue away from ANSI 4 #bca5f2 (lavender) so keywords and
# constants stay distinguishable. Contrast ~8.3:1.
color5 #ea86ff
